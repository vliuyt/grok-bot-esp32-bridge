<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>小糖 · 表情实验室</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <header>
    <a class="brand" href="./"><span class="brand-dot" aria-hidden="true"></span>小糖 <span>COMPANION</span></a>
    <span class="edition">v0.2.0 · 表情预览</span>
  </header>
  <main>
    <section class="intro" aria-labelledby="title">
      <p class="eyebrow">一点小表情，一点陪伴。</p>
      <h1 id="title">你一伸手，<br>它就有了回应。</h1>
      <p class="lead">轻点是好奇，抚摸会开心。<br>那张熟悉的粉色圆脸，多了一点自己的小心思。</p>
    </section>
    <section class="device-area" aria-label="圆屏互动预览">
      <div class="device-shadow"></div>
      <div class="device-shell">
        <canvas id="screen" width="932" height="932" role="img" aria-label="小糖待机圆屏，点击好奇，横向拖动抚摸" tabindex="0"></canvas>
        <button id="boot" aria-label="按住 BOOT 模拟说话">BOOT</button>
        <div id="settings" class="settings" hidden>
          <p class="settings-title">舒服一点</p>
          <label class="setting-row">模拟连接 <input id="setting-online" type="checkbox" checked></label>
          <label class="setting-row">安静陪伴 <input type="checkbox" checked disabled></label>
          <p class="settings-note">字幕模式将在下一步加入。<br>这里的 BOOT 只模拟听说状态。</p>
          <button id="close-settings">回到小糖</button>
        </div>
      </div>
      <p class="device-caption"><span id="connection-dot" class="connection-dot"></span><span id="connection-text">语音就绪 · 模拟</span><span class="divider">/</span>轻点 · 横向抚摸 · 上划设置</p>
      <p class="boot-help">按住右侧 BOOT 或空格键，松开看它回答</p>
    </section>
    <section class="controls" aria-labelledby="state-title">
      <div class="section-heading"><h2 id="state-title">它的九种小表情</h2><span>01 — 09</span></div>
      <div id="states" class="states">
        <button data-mode="idle" aria-pressed="true"><span class="state-num">01</span><strong>待机</strong><small>安静地陪你</small></button>
        <button data-mode="curious" aria-pressed="false"><span class="state-num">02</span><strong>好奇</strong><small>嗯？我在呢</small></button>
        <button data-mode="happy" aria-pressed="false"><span class="state-num">03</span><strong>开心</strong><small>再摸一下嘛</small></button>
        <button data-mode="greet" aria-pressed="false"><span class="state-num">04</span><strong>招呼</strong><small>嘿，我在这里</small></button>
        <button data-mode="listen" aria-pressed="false"><span class="state-num">05</span><strong>聆听</strong><small>认真听你说</small></button>
        <button data-mode="think" aria-pressed="false"><span class="state-num">06</span><strong>思考</strong><small>让我想想</small></button>
        <button data-mode="speak" aria-pressed="false"><span class="state-num">07</span><strong>回答</strong><small>说给你听</small></button>
        <button data-mode="confused" aria-pressed="false"><span class="state-num">08</span><strong>困惑</strong><small>等一下，再试试</small></button>
        <button data-mode="sleep" aria-pressed="false"><span class="state-num">09</span><strong>困倦</strong><small>眯一小会儿</small></button>
      </div>
      <div class="interaction-row"><button id="pet">摸摸小糖</button><button id="connection">模拟断网</button></div>
      <p id="status" class="status" role="status" aria-live="polite">安静地陪你。</p>
      <p id="error" class="error" role="alert" hidden></p>
    </section>
  </main>
  <footer><span>经典粉色圆脸 · 微雪 1.43C 圆屏</span><span>无声预览 · 不录音 · 未更新设备</span></footer>
</body>
</html>
